services:
    # PostgreSQL
    db:
        image: postgres:16-alpine
        container_name: smartstock_db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-smartstock_pro}
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql/data
        networks:
            - smartstock_net
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-smartstock_pro}",
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    # Laravel App (PHP-FPM)
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: smartstock_app
        restart: unless-stopped
        volumes:
            - app_storage:/var/www/html/storage/app
            - app_logs:/var/www/html/storage/logs
        environment:
            APP_ENV: production
            APP_KEY: ${APP_KEY}
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: ${DB_DATABASE:-smartstock_pro}
            DB_USERNAME: ${DB_USERNAME:-postgres}
            DB_PASSWORD: ${DB_PASSWORD:-secret}
            QUEUE_CONNECTION: database
            SESSION_DRIVER: database
            CACHE_STORE: database
            SKIP_SETUP: "false"
        depends_on:
            db:
                condition: service_healthy
        networks:
            - smartstock_net

    # Nginx
    nginx:
        image: nginx:1.27-alpine
        container_name: smartstock_nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - smartstock_net

    # Queue Worker
    # Memproses background jobs (GenerateReportJob, ImportProductsJob, TransferStockJob)
    # ketika QUEUE_CONNECTION=database dipakai di production.
    worker:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: smartstock_worker
        restart: unless-stopped
        command: php artisan queue:work database --sleep=3 --tries=3 --max-time=3600
        volumes:
            - app_storage:/var/www/html/storage/app
            - app_logs:/var/www/html/storage/logs
        environment:
            APP_ENV: production
            APP_KEY: ${APP_KEY}
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: ${DB_DATABASE:-smartstock_pro}
            DB_USERNAME: ${DB_USERNAME:-postgres}
            DB_PASSWORD: ${DB_PASSWORD:-secret}
            QUEUE_CONNECTION: database
            SESSION_DRIVER: database
            CACHE_STORE: database
            SKIP_SETUP: "true" # Worker tidak perlu migrate/seed
        depends_on:
            db:
                condition: service_healthy
        networks:
            - smartstock_net

volumes:
    db_data:
    app_storage:
    app_logs:

networks:
    smartstock_net:
        driver: bridge
