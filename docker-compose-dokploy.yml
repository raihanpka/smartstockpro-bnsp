services:
  # PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: smartstock_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-smartstock_pro}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - smartstock_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-smartstock_pro}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Laravel App (PHP-FPM)
  # Dokploy mengelola SSL dan reverse proxy sendiri, sehingga tidak ada container Nginx.
  # Port 9000 diekspor agar Dokploy dapat meneruskan request ke PHP-FPM.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartstock_app
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-smartstock_pro}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      CACHE_STORE: database
      FILESYSTEM_DISK: local
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@smartstockpro.id}
      MAIL_FROM_NAME: "SmartStock Pro"
      SKIP_SETUP: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smartstock_net

  # Queue Worker
  # Memproses background jobs: GenerateReportJob, ImportProductsJob, TransferStockJob
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartstock_worker
    restart: unless-stopped
    command: php artisan queue:work database --sleep=3 --tries=3 --max-time=3600
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-smartstock_pro}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      CACHE_STORE: database
      SKIP_SETUP: "true" # Worker tidak menjalankan migrate/seed
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smartstock_net

volumes:
  db_data:
  app_storage:
  app_logs:

networks:
  smartstock_net:
    driver: bridge
