services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartstock_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_ENV=production
      - DB_HOST=db
    depends_on:
      - db
    networks:
      - smartstock_net

  nginx:
    image: nginx:1.25-alpine
    container_name: smartstock_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - smartstock_net

  db:
    image: postgres:16-alpine
    container_name: smartstock_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartstock_pro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - smartstock_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartstock_worker
    restart: unless-stopped
    command: php artisan queue:work database --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    environment:
      - DB_HOST=db
    depends_on:
      - db
    networks:
      - smartstock_net

volumes:
  db_data:

networks:
  smartstock_net:
    driver: bridge
